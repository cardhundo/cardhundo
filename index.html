<style>
:root{
 --navy:#07111f;--navy2:#0d1b31;--ink:#142238;--muted:#69778b;--paper:#f5f7fb;
 --card:#fff;--line:#e3e8ef;--orange:#ff5b35;--orange2:#ffb05f;--blue:#4f7cff;
 --green:#0b8a61;--shadow:0 24px 80px rgba(7,17,31,.12);--r:24px
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}

.container{width:min(1240px,92%);margin:auto}

.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative}

.navlinks{display:flex;gap:19px;align-items:center;color:#b9c5d7;font-size:13px;font-weight:850}
.navlinks a:hover{color:#fff}.navbtn{background:var(--orange);color:#fff!important;padding:11px 16px;border-radius:13px}
.hero{position:relative;overflow:hidden;background:
 radial-gradient(circle at 82% 5%,rgba(255,91,53,.25),transparent 28%),
 radial-gradient(circle at 7% 25%,rgba(79,124,255,.22),transparent 28%),
 linear-gradient(135deg,#06101e,#0d1b31 60%,#14233c);color:#fff;padding:92px 0 135px}

.trust div{padding:17px;border-right:1px solid rgba(255,255,255,.1)}.trust div:last-child{border:0}
.trust b{display:block;font-size:23px}.trust span{font-size:10px;color:#9eacc0}

.hint{text-align:center;color:#8a96a7;font-size:10px;margin-top:10px}
.section{padding:84px 0}.dark{background:#07111f;color:#fff}
.heading{text-align:center;max-width:850px;margin:0 auto 38px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:var(--orange);font-weight:950}
.heading h2{font-size:clamp(31px,4vw,50px);letter-spacing:-2px;line-height:1.04;margin-top:7px}.heading p{color:var(--muted);margin-top:10px;font-size:14px}.dark .heading p{color:#9eacc0}
.results{display:none}.results.show{display:block}.results-top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:23px}.results-top h2{font-size:38px;letter-spacing:-1.5px}.results-top p{color:var(--muted);font-size:12px}

.bestimg{height:180px;border-radius:18px;background:#eef2f6;overflow:hidden}.bestimg img{width:100%;height:100%;object-fit:contain}.best h3{font-size:29px;margin:4px 0}.price{color:var(--orange);font-weight:950;font-size:15px}
.reason{color:var(--muted);font-size:12px;margin-top:8px}.score{width:100px;height:100px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ebf8f2;border:8px solid #d5efe4;color:var(--green)}.score b{font-size:25px}.score span{font-size:8px;font-weight:950;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.media-fallback b{font-size:25px}.media-fallback span{display:block;color:#7a879a;font-size:11px;margin-top:3px}
.badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border-radius:9px;padding:6px 8px;font-size:9px;font-weight:950;z-index:2}
.heart{position:absolute;right:12px;top:12px;width:35px;height:35px;border:0;border-radius:50%;background:#fff;font-size:17px;color:#65738a;z-index:2}
.carbody{padding:17px}.carrow{display:flex;justify-content:space-between;gap:10px}.car h3{font-size:18px}.sub{color:var(--muted);font-size:11px;margin-top:2px}
.match{background:#eaf8f1;color:var(--green);padding:6px 8px;border-radius:8px;font-size:9px;font-weight:950;white-space:nowrap;height:max-content}
.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.spec{background:#f7f9fb;border-radius:9px;padding:8px;font-size:9px;color:#7b8798}.spec b{display:block;color:#27364b;font-size:11px;margin-top:2px}
.cardactions{display:flex;gap:7px}.cardactions button{flex:1;border:0;border-radius:10px;padding:10px;font-size:11px;font-weight:900}.details{background:var(--navy);color:#fff}.compare{background:#fff;border:1px solid #d8e0ea!important;color:#39475c}
.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:20px;text-align:center;padding:50px;color:var(--muted)}
.brand-filter{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}.brand-pill{border:1px solid #d9e0ea;background:#fff;color:#405069;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900;transition:.18s}.brand-pill:hover,.brand-pill.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.catalog-tools{display:grid;grid-template-columns:1fr 220px;gap:10px;align-items:center;margin-bottom:18px}.populargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.popularcard{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff;cursor:pointer;transition:.2s}.popularcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(12,35,65,.09)}
.mini{height:135px;border-radius:13px;background:#f1f4f8;overflow:hidden}.mini img{width:100%;height:100%;object-fit:contain}.popularcard h3{font-size:15px;margin-top:11px}.popularcard p{font-size:10px;color:var(--muted)}
.comparebar{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:190;width:min(1000px,94%);background:#07111f;color:#fff;border:1px solid rgba(255,255,255,.13);box-shadow:0 22px 70px rgba(0,0,0,.32);border-radius:18px;padding:12px 14px;align-items:center;gap:10px}.comparebar.show{display:flex}.comparechips{display:flex;gap:6px;flex:1;overflow:auto}.chip{background:#17253a;border-radius:9px;padding:7px 8px;font-size:10px;white-space:nowrap}.chip button{border:0;background:none;color:#aeb9c8;margin-left:4px}.comparebar .btn{padding:9px 12px;font-size:11px}
.comparetable{width:100%;border-collapse:collapse;font-size:12px;background:#fff;color:var(--ink);border-radius:15px;overflow:hidden}.comparetable th,.comparetable td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.comparetable th{background:#f7f9fb}.comparetable td:first-child{font-weight:900;color:#405069}
.promo-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.promo{border-radius:22px;padding:26px;background:linear-gradient(135deg,#fff,#fff4ef);border:1px solid #f0d8cf}.promo h3{font-size:24px}.promo p{color:var(--muted);font-size:12px;margin:7px 0 15px}
.contact-box{border-radius:22px;padding:26px;background:#07111f;color:#fff;border:1px solid #1d2b40}.contact-box h3{font-size:21px}.contact-box p{color:#9eacc0;font-size:12px;margin:8px 0 15px}.contact-box a{color:#ff9a54;font-weight:900}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.ico{width:43px;height:43px;border-radius:12px;background:#fff0eb;color:var(--orange);display:grid;place-items:center;font-size:19px;margin-bottom:13px}.feature h3{font-size:17px}.feature p{font-size:12px;color:var(--muted);margin-top:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(3,10,20,.75);z-index:250;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:24px;width:min(1000px,100%);max-height:94vh;overflow:auto;padding:23px;position:relative}.close{position:absolute;right:15px;top:15px;border:0;width:37px;height:37px;border-radius:50%;background:#eef1f5;font-size:18px;z-index:3}
.detail-image{height:330px;background:#f0f3f7;border-radius:18px;overflow:hidden;margin-bottom:18px}.detail-image img{width:100%;height:100%;object-fit:contain}
.modal h2{font-size:31px;letter-spacing:-1px}.modalprice{color:var(--orange);font-size:18px;font-weight:950}
.modalgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.modalcell{background:#f7f9fb;border-radius:11px;padding:10px;font-size:10px;color:var(--muted)}.modalcell b{display:block;color:var(--ink);font-size:12px;margin-top:2px}
.financebox{margin-top:18px;padding:18px;border:1px solid #e5eaf1;border-radius:18px;background:linear-gradient(135deg,#f9fbff,#fff7f2)}.financegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.financegrid label{font-size:10px;font-weight:900;color:#405069}.financegrid input{display:block;width:100%;margin-top:5px;border:1px solid #d9e0e9;border-radius:10px;padding:9px;background:#fff}.financeout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.financeout div{background:#fff;border:1px solid #e7ebf0;border-radius:11px;padding:10px}.financeout small{display:block;color:#7b8798;font-size:9px}.financeout b{display:block;color:#132238;font-size:14px;margin-top:2px}
.source-note{font-size:10px;color:#7e8ba0;margin-top:14px}.official{display:inline-flex;margin-top:14px;color:var(--blue);font-weight:900;font-size:11px}
footer{background:#07111f;color:#fff;padding:55px 0 25px}.footergrid{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:30px}.footergrid h4{font-size:12px;margin-bottom:10px}.footergrid p,.footergrid a{color:#91a0b5;font-size:11px}.footergrid a{display:block;margin:7px 0}
.contact-card{border:1px solid #233249;background:#0c1930;border-radius:18px;padding:17px}.contact-card strong{font-size:20px;display:block;color:#fff}.contact-card a{color:#ff9a54;font-size:12px;font-weight:900}
.footbottom{text-align:center;border-top:1px solid #1e2d42;color:#708096;font-size:10px;margin-top:35px;padding-top:17px}
.mobile-nav{display:none}
@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.populargrid{grid-template-columns:1fr 1fr}.features{grid-template-columns:1fr 1fr}.footergrid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
 body{padding-bottom:64px}.owner-top{position:static;transform:none;font-size:9px}.nav{min-height:64px}.logo{font-size:24px}.navlinks{display:none}
 .hero{padding:62px 0 105px}.hero h1{letter-spacing:-2.8px}.hero-sub{font-size:15px}
 .trust{grid-template-columns:1fr}.trust div{border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}.trust div:last-child{border-bottom:0}
 .finder{padding:19px}.finder-head{display:block}.step{display:inline-block;margin-top:9px}.formgrid,.grid,.features,.promo-grid{grid-template-columns:1fr}.findbar{flex-direction:column}
 .results-top{display:block}.best.show{grid-template-columns:1fr}.bestimg{height:180px}.populargrid{grid-template-columns:1fr 1fr}.modalgrid{grid-template-columns:1fr 1fr}.financegrid,.financeout{grid-template-columns:1fr}.catalog-tools{grid-template-columns:1fr}.footergrid{grid-template-columns:1fr}
 .comparebar{bottom:72px}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;height:64px;background:rgba(7,17,31,.98);z-index:200;justify-content:space-around;align-items:center;border-top:1px solid #233249}.mobile-nav a{color:#b9c5d7;font-size:10px;font-weight:900;text-align:center}.mobile-nav b{display:block;font-size:17px;color:#fff;margin-bottom:1px}
}

.gf-mark{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:8px;border:2px solid currentColor;border-radius:9px;font-size:10px;font-style:normal;font-weight:1000;letter-spacing:-.5px;vertical-align:middle;box-shadow:0 0 0 3px rgba(255,212,59,.08)}
.logo{display:flex;align-items:center;gap:0}
.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.partner-panel{border:1px solid #233249;background:#0c1930;border-radius:18px;padding:20px;min-height:210px}.partner-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.partner-slot{min-height:88px;border:1px dashed #52627a;border-radius:13px;display:grid;place-items:center;text-align:center;color:#7f8ea4;font-size:10px;background:rgba(255,255,255,.02)}.partner-slot strong{display:block;color:#c6d0df;font-size:11px}.marketing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.marketing-slot{min-height:150px;border:1px dashed #b7c0cd;border-radius:16px;background:#fff;display:grid;place-items:center;text-align:center;color:#8793a4}.marketing-slot strong{color:#4a586d;display:block}.database-note{font-size:10px;color:#7e8ba0;margin-top:10px}

<body>
<header>
 <div class="container nav">
  <a class="logo" href="#top">Car<i>Dhundo</i></a>
  <div class="owner-top">FOUNDED & MAINTAINED BY TANMAY THORAT</div>
  <nav class="navlinks">
   <a href="#finder">Find Cars</a><a href="#catalog">All Cars</a><a href="#compare">Compare</a><a href="#promotions">Promotions</a><a href="#contact">Contact</a>
   <a class="navbtn" href="#finder">Find My Car</a>
  </nav>
 </div>
</header>

<section class="hero" id="top">
 <div class="container hero-content">
  <span class="pill">✦ INDIA'S SMARTER CAR FINDER</span>
  <h1>Don't search for a car.<br><span>Find your car.</span></h1>
  <p class="hero-sub">Search the complete GadiFinder catalogue by budget, fuel, family size, efficiency, body type and transmission. Get every qualifying model, not just one result.</p>
  <div class="hero-actions">
   <button class="btn primary" onclick="document.querySelector('#finder').scrollIntoView({behavior:'smooth'})">Find My Car →</button>
   <button class="btn light" onclick="document.querySelector('#catalog').scrollIntoView({behavior:'smooth'})">Explore All Cars</button>
  </div>
  <div class="trust">
   <div><b id="heroCount">116+</b><span>requested models in catalogue</span></div>
   <div><b>4 cars</b><span>side-by-side comparison</span></div>
   <div><b>Real image lookup</b><span>model image attempted automatically</span></div>
  </div>
 </div>
</section>

<main>
 <div class="container">
  <div class="ad"><strong>Premium Advertisement / Promotion Space</strong>&nbsp; • dealer campaigns • launches • finance partners • accessories • brand collaborations</div>
 </div>

 <section class="finder-wrap" id="finder">
  <div class="container">
   <div class="finder">
    <div class="finder-head"><div><h2>Tell GadiFinder what you need.</h2><p>Six choices → all qualifying cars → compare your favourites.</p></div><span class="step" id="step">1 of 6</span></div>
    <div class="progress"><i id="progress"></i></div>
    <div class="formgrid">
     <div class="field"><label>1 · Budget</label><select id="budget">
      <option value="5">Up to ₹5 Lakh</option><option value="8" selected>Up to ₹8 Lakh</option><option value="12">Up to ₹12 Lakh</option><option value="18">Up to ₹18 Lakh</option><option value="25">Up to ₹25 Lakh</option><option value="999">₹25 Lakh+</option>
     </select></div>
     <div class="field"><label>2 · Fuel</label><select id="fuel"><option>Any</option><option>Petrol</option><option>CNG</option><option>Diesel</option><option>Electric</option><option>Hybrid</option></select></div>
     <div class="field"><label>3 · Family / seating</label><select id="family"><option value="1-2">1–2 people</option><option value="3-4" selected>3–4 people</option><option value="5-6">5–6 people</option><option value="7+">7+ people</option></select></div>
     <div class="field"><label>4 · Minimum efficiency</label><select id="mileage"><option value="0" selected>Any</option><option value="15">15+ km/l</option><option value="18">18+ km/l</option><option value="20">20+ km/l</option><option value="25">25+ km/l</option></select></div>
     <div class="field"><label>5 · Body type</label><select id="type"><option>Any</option><option>SUV</option><option>Compact SUV</option><option>Hatchback</option><option>Sedan</option><option>MPV</option><option>EV</option><option>Pickup</option></select></div>
     <div class="field"><label>6 · Transmission</label><select id="trans"><option>Any</option><option>Manual</option><option>Automatic</option><option>AMT</option><option>CVT/IVT</option><option>DCT</option></select></div>
    </div>
    <div class="findbar"><button class="btn primary" id="findBtn" onclick="findCars()">Show All Matching Cars →</button><button class="btn outline" onclick="resetFinder()">Reset</button></div>
    <div class="hint">Budget matching uses starting-price data only where a verified current price is available. Models without a verified price remain visible separately instead of being falsely excluded.</div>
   </div>
  </div>
 </section>

 <section class="section results" id="results">
  <div class="container">
   <div class="results-top"><div><span class="eyebrow">Your shortlist</span><h2>All cars that fit.</h2><p id="resultText"></p></div><span class="step">★ ranked results</span></div>
   <div class="best" id="best"></div>
   <div class="grid" id="grid"></div>
  </div>
 </section>

 <section class="section" id="catalog">

const cars = carDatabase.map(c=>({...c}));
const byId=id=>cars.find(c=>c.id===id);
const money=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const safePrice=c=>c.price==null?"Price to verify":`₹${c.price.toFixed(2)} Lakh*`;
function familyOK(c,w){if(w==="7+")return c.seats>=7;if(w==="5-6")return c.seats>=5;if(w==="3-4")return c.seats>=4;return c.seats<=4}
function hardMatch(c,opts){
 const max=+opts.budget;
 if(c.price==null) return false;
 if(c.price>max) return false;
 if(opts.fuel!=="Any" && !c.fuel.includes(opts.fuel)) return false;
 if(!familyOK(c,opts.family)) return false;
 if(opts.mileage && +opts.mileage>0){ if(c.mileage==null || c.mileage<+opts.mileage) return false; }
 if(opts.type!=="Any" && c.type!==opts.type && !(opts.type==="EV" && c.fuel.includes("Electric"))) return false;
 if(opts.trans!=="Any" && !c.trans.includes(opts.trans)) return false;
 return true;
}
function scoreCar(c,opts){
 if(!hardMatch(c,opts)) return null;
 let s=100,reasons=[];
 const max=+opts.budget;
 const priceFit=Math.max(0,1-(c.price/max)); s+=Math.round(priceFit*10);
 reasons.push(`₹${c.price.toFixed(2)} lakh starting price within your ₹${max} lakh budget`);
 if(opts.fuel!=="Any") reasons.push(`${opts.fuel} available`);
 reasons.push(`${c.seats} seats`);
 if(opts.mileage) reasons.push(`${c.mileage} km/l or km/kg verified efficiency`);
 if(opts.type!=="Any") reasons.push(`${c.type} selected`);
 if(opts.trans!=="Any") reasons.push(`${opts.trans} available`);
 return {...c,score:s,reasons};
}
function imageQuery(c){return encodeURIComponent(`${c.brand} ${c.name} car India`)}
function fallback(c){return `<div class="media-fallback"><div><b>${esc(c.brand)}</b><span>${esc(c.name)}</span><small style="display:block;margin-top:9px;color:#a06b55;font-size:9px">Add the model image URL in imageUrl/gallery in the car database.</small></div></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function loadImage(c,img){
 const direct=c.imageUrl&&/^https?:\/\//i.test(c.imageUrl)?c.imageUrl:'';
 if(direct){img.src=direct;img.dataset.loaded='1';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'media-fallback',innerHTML:fallback(c)}));};return}
 const url=`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${imageQuery(c)}&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*`;
 try{const r=await fetch(url);const j=await r.json();const pages=Object.values(j.query?.pages||{});const p=pages.find(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url);if(p){img.src=p.imageinfo[0].thumburl||p.imageinfo[0].url;img.dataset.loaded='1';return}}catch(e){}
 img.outerHTML=fallback(c);
}
function imageHTML(c,cls=''){
 const ph=`<div class="${cls||''}" data-img="${esc(c.id)}">${fallback(c)}</div>`;
 setTimeout(()=>{const host=document.querySelector(`[data-img="${CSS.escape(c.id)}"]`);if(host&&!host.querySelector('img')){host.innerHTML=`<img alt="${esc(c.brand+' '+c.name)}" style="width:100%;height:100%;object-fit:contain">`;loadImage(c,host.querySelector('img'));}},0);
 return ph;
}
function galleryHTML(c){const urls=(c.gallery||[]).filter(Boolean);if(!urls.length)return `<div class="empty"><p>No gallery URLs added yet. Add them in the car database.</p></div>`;return `<div class="thumbs">${urls.map((u,i)=>`<img src="${esc(u)}" alt="${esc(c.name)} image ${i+1}" onerror="this.style.display='none'">`).join('')}</div>`}
function cardHTML(c,i){
 const pct=Math.min(99,Math.round(c.score||100));
 return `<article class="car" onclick="openCar('${c.id}')"><div class="car-media"><span class="badge">#${i+1} match</span><button class="heart" onclick="event.stopPropagation();toggleSave(this)">♡</button>${imageHTML(c)}</div>
 <div class="carbody"><div class="carrow"><div><h3>${esc(c.brand)} ${esc(c.name)}</h3><div class="price">${safePrice(c)}</div><div class="sub">${c.type} • ${c.seats} seats</div></div><span class="match">${pct}%</span></div>
 <div class="specgrid"><div class="spec">Fuel<b>${c.fuel.join(' / ')}</b></div><div class="spec">Gearbox<b>${c.trans.join(' / ')}</b></div><div class="spec">Variants<b>${c.variants?.length||'Add data'}</b></div><div class="spec">Images<b>${c.imageUrl?'Main + gallery':'URL slot ready'}</b></div></div>

 <div class="cardactions"><button class="details" onclick="event.stopPropagation();openCar('${c.id}')">Complete info</button><button class="compare" onclick="event.stopPropagation();addCompare('${c.id}')">+ Compare</button></div></div></article>`;
}
function findCars(){
 const btn=document.getElementById('findBtn');btn.disabled=true;btn.textContent='Finding exact matches…';
 const opts={budget:document.getElementById('budget').value,fuel:document.getElementById('fuel').value,family:document.getElementById('family').value,mileage:document.getElementById('mileage').value,type:document.getElementById('type').value,trans:document.getElementById('trans').value};
 const ranked=cars.map(c=>scoreCar(c,opts)).filter(Boolean).sort((a,b)=>b.score-a.score||String(a.name).localeCompare(b.name));
 setTimeout(()=>{btn.disabled=false;btn.textContent='Show Exact Matching Cars →';renderResults(ranked,opts)},250);
}
function renderResults(list,opts){

 document.getElementById("resultText").textContent=`Showing ${list.length} exact matches from the ${cars.length}-model GadiFinder catalogue. Only cars that satisfy every selected requirement are shown.`;
 if(!list.length){grid.innerHTML='<div class="empty"><h3>No strong matches</h3><p>Try a wider budget, Any fuel, Any body type or Any transmission.</p></div>';return}
 const top=list[0];
 best.innerHTML=`<div class="bestimg">${imageHTML(top)}</div><div><div class="eyebrow">★ Highest ranked</div><h3>${esc(top.brand)} ${esc(top.name)}</h3><div class="price">${safePrice(top)}</div><p class="reason">${top.reasons.slice(0,5).join(" • ")}</p><button class="btn primary" style="margin-top:13px" onclick="openCar('${top.id}')">View complete car info</button></div><div class="score"><b>${Math.min(99,Math.round(top.score))}%</b><span>match</span></div>`;
 best.classList.add("show");
 list.forEach((c,i)=>grid.insertAdjacentHTML("beforeend",cardHTML(c,i)));
 sec.scrollIntoView({behavior:"smooth",block:"start"});
}

function updateFinance(id){

 const dp=+document.getElementById(`dp-${id}`).value||0,rate=+document.getElementById(`rate-${id}`).value||0,n=Math.max(1,+document.getElementById(`term-${id}`).value||60);
 const price=c.price*100000,down=price*dp/100,p=price-down,m=rate/1200,emi=m?p*m*Math.pow(1+m,n)/(Math.pow(1+m,n)-1):p/n,total=emi*n;
 document.getElementById(`finance-${id}`).innerHTML=`<div><small>Upfront down payment</small><b>${money(down)}</b></div><div><small>Estimated EMI / month</small><b>${money(emi)}</b></div><div><small>Total repayment</small><b>${money(total)}</b></div>`;
}

  ["Starting price",c=>safePrice(c)],["Fuel",c=>c.fuel.join(" / ")],["Seats",c=>c.seats],["Body type",c=>c.type],["Transmission",c=>c.trans.join(" / ")],["Official source",c=>`<a href="${official[c.brand]}" target="_blank" style="color:#4f7cff;font-weight:900">Open ${esc(c.brand)} ↗</a>`]
 ];
 out.innerHTML=`<div style="overflow:auto"><table class="comparetable"><thead><tr><th>Specification</th>${selected.map(c=>`<th>${esc(c.brand)}<br>${esc(c.name)}<br><button class="btn" style="padding:5px 8px;margin-top:6px;background:#fff0eb;color:#d84b2c" onclick="removeCompare('${c.id}')">Remove</button></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${selected.map(c=>`<td>${r[1](c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
 document.querySelector("#compare").scrollIntoView({behavior:"smooth",block:"center"});
}
let activeBrand="All";
function renderBrands(){
 const brands=Object.keys(catalogue);
 document.getElementById("brandFilter").innerHTML=`<button class="brand-pill active" onclick="filterBrand('All',this)">All Brands</button>`+brands.map(b=>`<button class="brand-pill" onclick="filterBrand(${JSON.stringify(b)},this)">${esc(b)}</button>`).join("");
}
function filterBrand(brand,el){activeBrand=brand;document.querySelectorAll(".brand-pill").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");renderCatalog()}
function renderCatalog(){
 const q=document.getElementById("catalogSearch").value.toLowerCase().trim(),body=document.getElementById("bodyFilter").value;
 const list=cars.filter(c=>(activeBrand==="All"||c.brand===activeBrand)&&(!q||`${c.brand} ${c.name}`.toLowerCase().includes(q))&&(body==="all"||c.type===body));
 document.getElementById("catalogGrid").innerHTML=list.length?list.map(c=>`<article class="popularcard" onclick="openCar('${c.id}')"><div class="mini">${imageHTML(c)}</div><h3>${esc(c.brand)} ${esc(c.name)}</h3><p>${c.type} • ${c.fuel.join(" / ")} • ${c.seats} seats</p><div class="price" style="margin-top:6px">${safePrice(c)}</div></article>`).join(""):'<div class="empty" style="grid-column:1/-1"><h3>No cars found</h3><p>Try another brand, body type or search term.</p></div>';
}
function resetFinder(){document.getElementById("budget").value="8";document.getElementById("fuel").value="Any";document.getElementById("family").value="3-4";document.getElementById("mileage").value="0";document.getElementById("type").value="Any";document.getElementById("trans").value="Any";document.getElementById("progress").style.width="16.6%";document.getElementById("step").textContent="1 of 6"}
["budget","fuel","family","mileage","type","trans"].forEach((id,i)=>document.getElementById(id).addEventListener("change",()=>{document.getElementById("progress").style.width=((i+1)/6*100)+"%";document.getElementById("step").textContent=(i+1)+" of 6"}));
document.getElementById("catalogSearch").addEventListener("input",renderCatalog);document.getElementById("bodyFilter").addEventListener("change",renderCatalog);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("heroCount").textContent=cars.length+" models";
renderBrands();renderCatalog();
</script>
</body>
</html>
