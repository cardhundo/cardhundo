<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="GadiFinder — Find, compare and explore cars available in India.">

<meta name="theme-color" content="#0F172A">

<!-- Google Search Console -->
<meta name="google-site-verification"
      content="SgqZ9yGE-HvlXzNbv-H4vzFWVXJqt0wzoXyhwAmzaQM">

<title>GadiFinder — Find. Compare. Decide.</title>

<style>

/* =========================================================
   GADIFINDER
   MASTER DESIGN SYSTEM
   ========================================================= */

:root{
  --navy:#0F172A;
  --navy2:#111C31;
  --navy3:#17243B;
  --navy4:#1D2D49;

  --yellow:#FFD43B;
  --yellow2:#FFE87A;

  --white:#FFFFFF;
  --soft:#F6F8FC;
  --soft2:#EEF2F7;

  --text:#162033;
  --muted:#64748B;
  --muted2:#94A3B8;

  --border:#DCE3ED;
  --dark-border:#263752;

  --green:#16A34A;
  --red:#DC2626;

  --shadow:0 20px 60px rgba(15,23,42,.10);
  --shadow-dark:0 20px 60px rgba(0,0,0,.22);

  --radius:22px;
  --radius2:16px;

  --max:1280px;

  --transition:.22s ease;
}

/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:var(--soft);
  color:var(--text);
  line-height:1.55;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
  display:block;
}

/* =========================================================
   GLOBAL
   ========================================================= */

.container{
  width:min(calc(100% - 40px),var(--max));
  margin:auto;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.yellow{
  color:var(--yellow);
}

.center{
  text-align:center;
}

.page{
  min-height:calc(100vh - 82px);
}

.section{
  padding:80px 0;
}

.section-sm{
  padding:50px 0;
}

.section-title{
  font-size:clamp(30px,4vw,48px);
  line-height:1.08;
  letter-spacing:-1.5px;
  font-weight:900;
}

.section-subtitle{
  max-width:720px;
  color:var(--muted);
  margin-top:15px;
  font-size:17px;
}

/* =========================================================
   HEADER
   ========================================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;

  height:82px;

  background:rgba(15,23,42,.96);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.07);
}

.header-inner{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:0;

  font-size:32px;
  font-weight:950;
  letter-spacing:-1.8px;
  color:white;

  white-space:nowrap;
}

.logo .yellow{
  color:var(--yellow);
}

.main-nav{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#CBD5E1;

  padding:13px 17px;
  border-radius:13px;

  font-weight:800;
  font-size:14px;

  transition:var(--transition);
}

.nav-btn:hover{
  color:white;
  background:rgba(255,255,255,.07);
}

.nav-btn.active{
  color:var(--navy);
  background:var(--yellow);
}

.mobile-menu{
  display:none;

  width:45px;
  height:45px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;

  background:rgba(255,255,255,.06);
  color:white;

  font-size:22px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 80% 15%,
      rgba(255,212,59,.13),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #0F172A,
      #111C31 65%,
      #0B1322
    );

  color:white;

  padding:95px 0 110px;
}

.hero-grid{
  display:grid;
  grid-template-columns:
    minmax(0,1.15fr)
    minmax(360px,.85fr);

  gap:60px;
  align-items:center;
}

.hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;

  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);

  padding:8px 13px;
  border-radius:999px;

  color:#CBD5E1;
  font-size:13px;
  font-weight:800;
  letter-spacing:.3px;
}

.hero-eyebrow span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 18px var(--yellow);
}

.hero h1{
  margin-top:24px;

  font-size:clamp(48px,7vw,82px);
  line-height:.98;

  letter-spacing:-4px;
  font-weight:950;
}

.hero h1 .highlight{
  color:var(--yellow);
}

.hero-text{
  max-width:690px;
  margin-top:25px;

  color:#B7C2D5;
  font-size:18px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:32px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn{
  min-height:50px;

  border:0;
  border-radius:14px;

  padding:0 21px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  font-weight:900;
  font-size:14px;

  transition:
    transform var(--transition),
    box-shadow var(--transition),
    background var(--transition);
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  background:var(--yellow);
  color:var(--navy);

  box-shadow:
    0 12px 30px rgba(255,212,59,.20);
}

.btn-primary:hover{
  background:var(--yellow2);
}

.btn-dark{
  background:var(--navy);
  color:white;
}

.btn-outline{
  background:transparent;
  color:inherit;
  border:1px solid currentColor;
}

.btn-light{
  background:white;
  color:var(--navy);
  border:1px solid var(--border);
}

/* =========================================================
   HERO PREVIEW
   ========================================================= */

.hero-panel{
  border:
    1px solid rgba(255,255,255,.10);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  border-radius:28px;
  padding:22px;

  box-shadow:var(--shadow-dark);
}

.hero-panel-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.hero-panel-title{
  font-size:14px;
  font-weight:900;
  color:white;
}

.status-dot{
  display:flex;
  align-items:center;
  gap:7px;

  color:#CBD5E1;
  font-size:12px;
}

.status-dot::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:#4ADE80;
}

.hero-car-placeholder{
  height:250px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );

  border:1px dashed rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#94A3B8;
  text-align:center;
  padding:20px;
}

.hero-mini-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.hero-mini{
  padding:13px;
  border-radius:14px;

  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
}

.hero-mini strong{
  display:block;
  color:white;
  font-size:14px;
}

.hero-mini small{
  color:#94A3B8;
}

/* =========================================================
   WHITE CARDS
   ========================================================= */

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-pad{
  padding:26px;
}

/* =========================================================
   FEATURE CARDS
   ========================================================= */

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.feature-card{
  padding:28px;
  min-height:210px;

  border-radius:var(--radius);
  border:1px solid var(--border);
  background:white;

  transition:var(--transition);
}

.feature-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
  border-color:#CBD5E1;
}

.feature-icon{
  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:#FFF7CC;
  color:#8A6800;

  font-size:22px;
  margin-bottom:20px;
}

.feature-card h3{
  font-size:20px;
  font-weight:900;
}

.feature-card p{
  color:var(--muted);
  margin-top:9px;
}

.feature-link{
  display:inline-block;
  margin-top:20px;

  color:#9A7600;
  font-weight:900;
  font-size:13px;
}

/* =========================================================
   ADVERTISEMENT
   ========================================================= */

.ad-box{
  min-height:220px;

  border:2px dashed #CBD5E1;
  border-radius:22px;

  background:
    repeating-linear-gradient(
      45deg,
      #F8FAFC,
      #F8FAFC 10px,
      #F1F5F9 10px,
      #F1F5F9 20px
    );

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  color:#94A3B8;
}

.ad-box strong{
  display:block;
  color:#64748B;
  font-size:16px;
}

.ad-box small{
  display:block;
  margin-top:5px;
}

/* =========================================================
   FOUNDER
   ========================================================= */

.founder-wrap{
  position:relative;
  overflow:hidden;

  background:var(--navy);
  color:white;

  padding:75px 0 125px;
}

.founder-card{
  position:relative;
  z-index:2;

  max-width:760px;
  margin:auto;

  padding:42px;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.07),
      rgba(255,255,255,.025)
    );

  text-align:center;
}

.founder-label{
  color:#94A3B8;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.2px;
}

.founder-name{
  margin-top:10px;

  font-size:clamp(38px,6vw,65px);
  font-weight:950;
  letter-spacing:-2.5px;

  color:white;
}

.founder-name span{
  color:var(--yellow);
}

.founder-text{
  max-width:600px;
  margin:14px auto 0;

  color:#AAB7CB;
}

.founder-email{
  display:inline-block;
  margin-top:20px;

  color:var(--yellow);
  font-weight:900;
}

/* =========================================================
   SEMI-CIRCLE TRANSITION
   ========================================================= */

.curve-transition{
  position:absolute;
  bottom:-1px;
  left:-5%;
  width:110%;
  height:145px;

  background:var(--soft);

  border-radius:50% 50% 0 0 /
               100% 100% 0 0;

  transform:translateY(50%);
}

.curve-transition::before{
  content:"";

  position:absolute;

  left:50%;
  top:-65px;

  transform:translateX(-50%);

  width:130px;
  height:130px;

  border-radius:50%;

  background:var(--navy);
}

/* =========================================================
   PAGE HEAD
   ========================================================= */

.page-head{
  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy2)
    );

  color:white;

  padding:65px 0;
}

.page-head h1{
  font-size:clamp(38px,5vw,62px);
  line-height:1;
  letter-spacing:-2.5px;
}

.page-head p{
  max-width:720px;
  margin-top:14px;
  color:#AAB7CB;
}

/* =========================================================
   FILTER PANEL
   ========================================================= */

.filter-panel{
  padding:25px;

  background:white;
  border:1px solid var(--border);
  border-radius:22px;

  box-shadow:var(--shadow);
}

.filter-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  font-size:13px;
  font-weight:900;
  color:#334155;
}

.field input,
.field select,
.field textarea{
  width:100%;

  min-height:48px;

  border:
    1px solid #CBD5E1;

  border-radius:13px;

  background:white;
  color:var(--text);

  padding:11px 13px;

  outline:none;

  transition:var(--transition);
}

.field textarea{
  min-height:145px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#E2B900;

  box-shadow:
    0 0 0 4px rgba(255,212,59,.17);
}

.filter-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* =========================================================
   CAR GRID
   ========================================================= */

.car-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:18px;
}

.car-card{
  overflow:hidden;

  background:white;
  border:1px solid var(--border);

  border-radius:22px;

  transition:var(--transition);
}

.car-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.car-image{
  height:215px;

  background:
    linear-gradient(
      135deg,
      #E9EEF5,
      #F8FAFC
    );

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#94A3B8;
  text-align:center;
  padding:20px;
}

.car-body{
  padding:22px;
}

.car-brand{
  color:#9A7600;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.car-name{
  margin-top:5px;
  font-size:22px;
  font-weight:950;
}

.car-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.pill{
  padding:6px 9px;

  border-radius:999px;

  background:#F1F5F9;
  color:#475569;

  font-size:11px;
  font-weight:800;
}

.car-price{
  margin-top:17px;
  font-size:18px;
  font-weight:950;
}

.car-price small{
  color:#94A3B8;
  font-size:11px;
  font-weight:700;
}

/* =========================================================
   BRAND GRID
   ========================================================= */

.brand-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:14px;
}

.brand-card{
  min-height:125px;

  padding:22px;

  border:1px solid var(--border);
  border-radius:18px;

  background:white;

  cursor:pointer;

  transition:var(--transition);
}

.brand-card:hover{
  border-color:#E5BE16;
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.brand-card strong{
  display:block;
  font-size:17px;
}

.brand-card span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   DETAIL PAGE
   ========================================================= */

.detail-hero{
  background:white;
  border-bottom:1px solid var(--border);
  padding:35px 0;
}

.detail-grid{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    minmax(320px,.8fr);

  gap:30px;
  align-items:start;
}

.gallery-main{
  height:420px;

  border-radius:24px;
  border:1px solid var(--border);

  background:
    linear-gradient(
      135deg,
      #E9EEF5,
      #F8FAFC
    );

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  color:#94A3B8;

  overflow:hidden;
}

.gallery-main img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.gallery-thumbs{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
  margin-top:10px;
}

.gallery-thumb{
  height:70px;

  border:1px dashed #CBD5E1;
  border-radius:11px;

  background:#F8FAFC;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#94A3B8;
  font-size:10px;

  overflow:hidden;
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-brand{
  color:#A17A00;
  text-transform:uppercase;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

.detail-title{
  font-size:clamp(38px,5vw,62px);
  line-height:1;
  letter-spacing:-2.5px;
  margin-top:8px;
}

.detail-price{
  margin-top:18px;
  font-size:25px;
  font-weight:950;
}

.detail-price small{
  font-size:12px;
  color:var(--muted);
}

.detail-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:25px;
}

/* =========================================================
   SPEC CARDS
   ========================================================= */

.spec-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:12px;
}

.spec{
  padding:18px;

  background:white;
  border:1px solid var(--border);

  border-radius:16px;
}

.spec span{
  display:block;
  color:#94A3B8;
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.spec strong{
  display:block;
  margin-top:5px;
  font-size:15px;
}

/* =========================================================
   VARIANTS
   ========================================================= */

.variant-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.variant{
  background:white;

  border:1px solid var(--border);
  border-radius:17px;

  overflow:hidden;
}

.variant-head{
  padding:18px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  cursor:pointer;
}

.variant-name{
  font-weight:950;
}

.variant-price{
  font-weight:950;
  color:#8A6800;
}

.variant-body{
  display:none;
  padding:0 20px 20px;
  border-top:1px solid var(--border);
}

.variant.open .variant-body{
  display:block;
}

.variant-features{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:9px;

  margin-top:17px;
}

.feature-row{
  padding:10px 12px;

  background:#F8FAFC;
  border-radius:10px;

  font-size:12px;
}

/* =========================================================
   INFO TABLE
   ========================================================= */

.info-table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.info-table th,
.info-table td{
  padding:14px 16px;
  text-align:left;
  border-bottom:1px solid var(--border);
}

.info-table th{
  width:32%;
  background:#F8FAFC;
  font-size:12px;
  text-transform:uppercase;
  color:#64748B;
}

.info-table td{
  font-weight:700;
}

/* =========================================================
   COMPARE
   ========================================================= */

.compare-controls{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:14px;
}

.compare-table-wrap{
  overflow:auto;

  border:1px solid var(--border);
  border-radius:20px;

  background:white;
}

.compare-table{
  width:100%;
  min-width:800px;
  border-collapse:collapse;
}

.compare-table th,
.compare-table td{
  padding:16px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.compare-table th{
  background:var(--navy);
  color:white;
}

.compare-table tr:last-child td{
  border-bottom:0;
}

/* =========================================================
   BUSINESS / CONTACT
   ========================================================= */

.business-grid{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:18px;
}

.business-card{
  padding:27px;

  border-radius:21px;
  border:1px solid var(--border);

  background:white;
}

.business-icon{
  font-size:28px;
}

.business-card h3{
  margin-top:17px;
  font-size:21px;
}

.business-card p{
  margin-top:8px;
  color:var(--muted);
}

.form-card{
  max-width:850px;
  margin:auto;

  padding:30px;

  background:white;
  border:1px solid var(--border);

  border-radius:22px;
  box-shadow:var(--shadow);
}

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:15px;
}

.full{
  grid-column:1/-1;
}

/* =========================================================
   EMI
   ========================================================= */

.emi-result{
  padding:28px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy3)
    );

  color:white;

  margin-top:20px;
}

.emi-number{
  font-size:42px;
  line-height:1;
  font-weight:950;
  color:var(--yellow);
}

.emi-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);

  gap:15px;
  margin-top:20px;
}

.emi-stat{
  padding:15px;

  border-radius:13px;

  background:rgba(255,255,255,.06);
}

.emi-stat span{
  color:#94A3B8;
  font-size:11px;
}

.emi-stat strong{
  display:block;
  margin-top:4px;
}

/* =========================================================
   EMPTY / NO RESULTS
   ========================================================= */

.empty-state{
  padding:55px 20px;

  text-align:center;

  border:1px dashed #CBD5E1;
  border-radius:20px;

  background:white;
}

.empty-state h3{
  font-size:21px;
}

.empty-state p{
  color:var(--muted);
  margin-top:6px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  z-index:5000;

  right:22px;
  bottom:22px;

  max-width:360px;

  padding:15px 18px;

  border-radius:14px;

  background:var(--navy);
  color:white;

  box-shadow:var(--shadow-dark);

  transform:translateY(120px);
  opacity:0;

  pointer-events:none;

  transition:.3s ease;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* =========================================================
   FOOTER
   ========================================================= */

.site-footer{
  background:#0B1322;
  color:white;

  padding:70px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:
    1.5fr
    1fr
    1fr
    1.2fr;

  gap:40px;
}

.footer-logo{
  font-size:25px;
  font-weight:950;
}

.footer-text{
  max-width:330px;
  color:#94A3B8;
  margin-top:14px;
}

.footer-title{
  font-weight:900;
  margin-bottom:14px;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.footer-link{
  border:0;
  padding:0;
  text-align:left;

  background:none;
  color:#94A3B8;

  cursor:pointer;

  transition:var(--transition);
}

.footer-link:hover{
  color:var(--yellow);
}

.footer-founder{
  padding:23px;

  border:1px solid #263752;
  border-radius:20px;

  background:#111C31;
}

.footer-founder strong{
  display:block;
  font-size:24px;
}

.footer-founder span{
  display:block;
  margin-top:5px;
  color:#94A3B8;
  font-size:12px;
}

.footer-email{
  display:block;
  margin-top:14px;
  color:var(--yellow);
  font-weight:900;
  font-size:13px;
}

.footer-bottom{
  margin-top:55px;
  padding-top:22px;

  border-top:1px solid #263752;

  display:flex;
  justify-content:space-between;
  gap:20px;

  font-size:12px;

/* =========================================================

    /* =========================================================
   DATABASE HELPERS
   ========================================================= */

function getAllCars(){

  return CARS.map((car,index)=>({
    ...car,
    id:
      slug(
        car.brand + "-" + car.name
      ) + "-" + index
  }));

}


function slug(value){

  return String(value)
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");

}


function findCar(id){

  return getAllCars()
    .find(car => car.id === id);

}


function findCarByBrandName(brand,name){

  return getAllCars()
    .find(
      car =>
        car.brand === brand &&
        car.name === name
    );

}


/* =========================================================
   ROUTING
   ========================================================= */

let currentRoute = "home";

let currentBrand = null;

let currentCarId = null;


function navigate(route){

  currentRoute = route;

  currentBrand = null;
  currentCarId = null;

  history.pushState(
    {route},
    "",
    "#" + route
  );

  closeMobileMenu();

  renderRoute();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function openBrand(brand){

  currentRoute = "models";
  currentBrand = brand;
  currentCarId = null;

  history.pushState(
    {route:"models",brand},
    "",
    "#brand/" + encodeURIComponent(brand)
  );

  closeMobileMenu();

  renderRoute();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function openCar(id){

  currentRoute = "detail";
  currentCarId = id;

  history.pushState(
    {route:"detail",id},
    "",
    "#car/" + encodeURIComponent(id)
  );

  closeMobileMenu();

  renderRoute();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function goBackToModels(){

  if(currentBrand){

    openBrand(currentBrand);

  }else{

    navigate("cars");

  }

}


/* =========================================================
   HASH ROUTING
   ========================================================= */

function loadHash(){

  const hash =
    location.hash
      .replace(/^#/,"");

  if(!hash){

    currentRoute="home";

    return;

  }


  if(hash.startsWith("brand/")){

    currentRoute="models";

    currentBrand=
      decodeURIComponent(
        hash.substring(6)
      );

    return;

  }


  if(hash.startsWith("car/")){

    currentRoute="detail";

    currentCarId=
      decodeURIComponent(
        hash.substring(4)
      );

    return;

  }


  currentRoute=hash;

}


window.addEventListener(
  "popstate",
  function(){

    loadHash();

    renderRoute();

  }
);


/* =========================================================
   RENDER ROUTE
   ========================================================= */

function renderRoute(){

  loadHash();

  const app =
    document.getElementById("app");

  if(!app) return;


  let templateId =
    currentRoute + "Page";


  if(
    currentRoute === "models"
  ){
    templateId="modelsPage";
  }

  if(
    currentRoute === "detail"
  ){
    templateId="detailPage";
  }


  const template =
    document.getElementById(templateId);


  if(!template){

    app.innerHTML =
      `
      <section class="section">
        <div class="container">
          <div class="empty-state">
            <h3>Page not found</h3>
            <p>The requested GadiFinder page does not exist.</p>
            <button class="btn btn-primary"
                    style="margin-top:18px"
                    onclick="navigate('home')">
              Return Home
            </button>
          </div>
        </div>
      </section>
      `;

    appendFooter();

    return;

  }


  app.innerHTML =
    template.innerHTML;


  updateActiveNav();


  if(currentRoute === "cars"){

    renderBrands();

  }


  if(currentRoute === "models"){

    renderModels();

  }


  if(currentRoute === "detail"){

    renderDetail();

  }


  if(currentRoute === "compare"){

    populateCompare();

  }


  appendFooter();

}


function updateActiveNav(){

  document
    .querySelectorAll(".nav-btn")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.route === currentRoute
      );

    });

}


function appendFooter(){

  const app =
    document.getElementById("app");

  const template =
    document.getElementById(
      "footerTemplate"
    );

  if(
    app &&
    template &&
    !app.querySelector(".site-footer")
  ){

    app.insertAdjacentHTML(
      "beforeend",
      template.innerHTML
    );

  }

}


/* =========================================================
   MOBILE MENU
   ========================================================= */

function toggleMobileMenu(){

  const nav =
    document.getElementById("mainNav");

  if(nav){

    nav.classList.toggle("open");

  }

}


function closeMobileMenu(){

  const nav =
    document.getElementById("mainNav");

  if(nav){

    nav.classList.remove("open");

  }

}


/* =========================================================
   BRAND PAGE
   ========================================================= */

function renderBrands(){

  const grid =
    document.getElementById(
      "brandGrid"
    );

  if(!grid) return;


  grid.innerHTML =
    Object.entries(DB.brands)
      .map(
        ([brand,data]) => {

          const count =
            data.models.length;

          return `
            <button
              class="brand-card"
              onclick='openBrand(${JSON.stringify(brand)})'>

              <strong>
                ${escapeHTML(brand)}
              </strong>

              <span>
                ${count} catalogue models
              </span>

            </button>
          `;

        }
      )
      .join("");

}


/* =========================================================
   MODEL PAGE
   ========================================================= */

function renderModels(){

  const title =
    document.getElementById(
      "modelsBrandTitle"
    );

  const description =
    document.getElementById(
      "modelsBrandDescription"
    );

  const grid =
    document.getElementById(
      "modelGrid"
    );


  const brandData =
    DB.brands[currentBrand];


  if(
    !brandData ||
    !grid
  ){

    if(grid){

      grid.innerHTML =
        `
        <div class="empty-state">
          <h3>Brand not found</h3>
          <p>Please return to All Cars.</p>
        </div>
        `;

    }

    return;

  }


  if(title){

    title.textContent =
      currentBrand;

  }


  if(description){

    description.textContent =
      brandData.description;

  }


  const models =
    brandData.models
      .map(
        name =>
          findCarByBrandName(
            currentBrand,
            name
          )
      )
      .filter(Boolean);


  grid.innerHTML =
    models
      .map(
        car =>
          carCardHTML(car)
      )
      .join("");


  if(!models.length){

    grid.innerHTML =
      `
      <div class="empty-state">
        <h3>Model information is being prepared</h3>
        <p>
          The model is part of the manufacturer catalogue,
          but detailed catalogue data has not yet been entered.
        </p>
      </div>
      `;

  }

}

  return `

      <div class="car-image">

        <div>
          <strong>
            ${escapeHTML(car.name)}
          </strong>

          <br>

          <small>

      <div class="car-body">

function specHTML(label,value){

/* =========================================================
   FORMATTERS
   ========================================================= */

function formatLakh(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return "—";

  }

  return Number(value)
    .toLocaleString(
      "en-IN",
      {
        maximumFractionDigits:2
      }
    ) + " L";

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   FINDER
   ========================================================= */

function runFinder(){

  const budget =
    parseFloat(
      document.getElementById(
        "findBudget"
      )?.value
    );

  const fuel =
    document.getElementById(
      "findFuel"
    )?.value || "";

  const transmission =
    document.getElementById(
      "findTransmission"
    )?.value || "";

  const body =
    document.getElementById(
      "findBody"
    )?.value || "";

  const seats =
    parseInt(
      document.getElementById(
        "findSeats"
      )?.value
    );

  const usage =
    document.getElementById(
      "findUsage"
    )?.value || "";


  let results =
    getAllCars();


  /*
     HARD FILTERS
  */

  if(!Number.isNaN(budget)){

    results =
      results.filter(
        car =>
          Number(car.priceMin) <= budget
      );

  }


  if(fuel){

    results =
      results.filter(
        car =>
          car.fuel.includes(fuel)
      );

  }


  if(transmission){

    results =
      results.filter(
        car =>
          car.transmission.some(
            item =>
              item === transmission ||
              (
                transmission === "Automatic" &&
                ["Automatic","AMT","CVT","DCT"]
                  .includes(item)
              ) ||
              (
                transmission === "CVT" &&
                ["CVT","IVT"].includes(item)
              )
          )
      );

  }


  if(body){

    results =
      results.filter(
        car =>
          car.body === body
      );

  }


  if(!Number.isNaN(seats)){

    results =
      results.filter(
        car =>
          Number(car.seats) >= seats
      );

  }


  if(usage){

    results =
      results.filter(
        car =>
          car.usage.includes(usage)
      );

  }


  const resultsBox =
    document.getElementById(
      "finderResults"
    );

  const summary =
    document.getElementById(
      "finderSummary"
    );


  if(!resultsBox) return;


  if(!results.length){

    resultsBox.innerHTML =
      `
      <div
        class="empty-state"
        style="grid-column:1/-1;">

        <h3>
          No exact matches found
        </h3>

        <p>
          Try increasing the budget or removing
          one of the filters.
        </p>

      </div>
      `;

    if(summary){

      summary.textContent =
        "0 matching cars found.";

    }

    return;

  }


  /*
     Limit visual results only after filtering.
     The database itself remains complete.
  */

  results =
    results.slice(0,60);


  resultsBox.innerHTML =
    results
      .map(
        car =>
          carCardHTML(car)
      )
      .join("");


  if(summary){

    summary.textContent =
      `${results.length} matching car${
        results.length === 1 ? "" : "s"
      } found.`;

  }

}

let compareCars = [];


function populateCompare(){

  const all =
    getAllCars();


  [
    "compare1",
    "compare2",
    "compare3"
  ]
  .forEach(
    id => {

      const select =
        document.getElementById(id);

      if(!select) return;


      select.innerHTML =

        `;


      all.forEach(
        car => {

          select.insertAdjacentHTML(
            "beforeend",
            `
            <option value="${escapeHTML(car.id)}">
              ${escapeHTML(car.brand)}
              — ${escapeHTML(car.name)}
            </option>
            `
          );

        }
      );

    }
  );

}


function addCompare(id){

  if(
    !compareCars.includes(id)
  ){

    compareCars.push(id);

  }


  if(compareCars.length > 3){

    compareCars =
      compareCars.slice(-3);

  }


  showToast(
    "Car added to comparison."
  );

  navigate("compare");

}


function runCompare(){

  const ids = [
    document.getElementById("compare1")?.value,
    document.getElementById("compare2")?.value,
    document.getElementById("compare3")?.value
  ]
  .filter(Boolean);


  if(ids.length < 2){

    showToast(
      "Please select at least two cars."
    );

    return;

  }


  const cars =
    ids
      .map(
        id =>
          findCar(id)
      )
      .filter(Boolean);


  const result =
    document.getElementById(
      "compareResult"
    );


  if(!result) return;


  const rows = [
    ["Brand","brand"],
    ["Model","name"],
    ["Body Type","body"],
    ["Fuel","fuel"],
    ["Transmission","transmission"],
    ["Seats","seats"],
    ["Engine","engine"],
    ["Power","power"],
    ["Torque","torque"],
    ["Drivetrain","drivetrain"],
    ["Boot","boot"],
    ["Usage","usage"],
    ["Starting Price","priceMin"],
    ["Maximum Catalogue Price","priceMax"]
  ];


  result.innerHTML = `

    <div class="compare-table-wrap">

      <table class="compare-table">

        <thead>

          <tr>

            <th>
              Specification
            </th>

            ${cars
              .map(
                car =>
                  `
                  <th>
                    ${escapeHTML(car.brand)}
                    <br>
                    ${escapeHTML(car.name)}
                  </th>
                  `
              )
              .join("")}

          </tr>

        </thead>


        <tbody>

          ${rows
            .map(
              ([label,key]) =>
                `
                <tr>

                  <td>
                    <strong>
                      ${escapeHTML(label)}
                    </strong>
                  </td>

                  ${cars
                    .map(
                      car =>
                        `
                        <td>
                          ${escapeHTML(
                            comparisonValue(
                              car,
                              key
                            )
                          )}
                        </td>
                        `
                    )
                    .join("")}

                </tr>
                `
            )
            .join("")}

        </tbody>

      </table>

    </div>

  `;

}


function comparisonValue(car,key){

  if(key === "fuel"){

    return car.fuel.join(" / ");

  }

  if(key === "transmission"){

    return car.transmission.join(" / ");

  }

  if(key === "usage"){

    return car.usage.join(" / ");

  }

  if(key === "priceMin"){

    return "₹" + formatLakh(car.priceMin);

  }

  if(key === "priceMax"){

    return car.priceMax
      ? "₹" + formatLakh(car.priceMax)
      : "—";

  }

  return car[key] ?? "—";

}

  [
    "compare1",

      }

  }

}


/* =========================================================
   EMI CALCULATOR
   ========================================================= */

function calculateEMI(){

  const principal =
    parseFloat(
      document.getElementById(
        "emiPrincipal"
      )?.value
    );

  const annualRate =
    parseFloat(
      document.getElementById(
        "emiRate"
      )?.value
    );

  const years =
    parseFloat(
      document.getElementById(
        "emiYears"
      )?.value
    );


  if(
    !principal ||
    !years ||
    Number.isNaN(principal) ||
    Number.isNaN(years)
  ){

    showToast(
      "Enter loan amount and tenure."
    );

    return;

  }


  const months =
    years * 12;

  const monthlyRate =
    (
      Number.isNaN(annualRate)
        ? 0
        : annualRate
    ) / 12 / 100;


  let emi;


  if(monthlyRate === 0){

    emi =
      principal / months;

  }else{

    emi =
      principal *
      monthlyRate *
      Math.pow(
        1 + monthlyRate,
        months
      ) /
      (
        Math.pow(
          1 + monthlyRate,
          months
        ) - 1
      );

  }


  const total =
    emi * months;

  const interest =
    total - principal;


  const box =
    document.getElementById(
      "emiResult"
    );


  if(!box) return;


  box.classList.remove(
    "hidden"
  );

  box.className =
    "emi-result";


  box.innerHTML = `

    <div>
      Estimated Monthly EMI
    </div>

    <div class="emi-number">
      ₹${Math.round(emi).toLocaleString("en-IN")}
    </div>


    <div class="emi-grid">

      <div class="emi-stat">
        <span>
          Loan Amount
        </span>
        <strong>
          ₹${Math.round(principal)
            .toLocaleString("en-IN")}
        </strong>
      </div>

      <div class="emi-stat">
        <span>
          Total Interest
        </span>
        <strong>
          ₹${Math.round(interest)
            .toLocaleString("en-IN")}
        </strong>
      </div>

      <div class="emi-stat">
        <span>
          Total Payment
        </span>
        <strong>
          ₹${Math.round(total)
            .toLocaleString("en-IN")}
        </strong>
      </div>

    </div>

  `;

}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  if(!toast) return;


  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2600
    );

}
